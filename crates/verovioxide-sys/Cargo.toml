[package]
name = "verovioxide-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Raw FFI bindings to the Verovio music engraving library"
keywords = ["mei", "music", "notation", "verovio", "ffi"]
categories = ["external-ffi-bindings"]
links = "verovio"
build = "build.rs"

[features]
default = ["bundled"]
# Compile Verovio C++ library from source (slower first build, but works everywhere)
bundled = []
# Legacy feature retained for dependency compatibility; requires bundled in this local fork.
prebuilt = []
# Force a fresh recompilation of the Verovio C++ library, bypassing the cache.
# Use with: cargo build --features force-rebuild
force-rebuild = []

[build-dependencies]
cc = "1"
dunce = "1"
sha2 = "0.10"

[dependencies]
